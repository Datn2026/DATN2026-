<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Điện thoại SIP</title>
<style>
:root{--bg:#eef2f1;--card:#fff;--ink:#14231f;--mut:#5d716b;--line:#d5dfdc;--pri:#0d7a66;--priInk:#fff;--red:#c8372d;--grn:#1f9d55;--amb:#b7791f;--key:#f3f7f6;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);color-scheme:light}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0e1614;--card:#17221f;--ink:#e6efec;--mut:#8da39c;--line:#2a3a36;--pri:#2bb89c;--priInk:#06211b;--red:#e5594e;--grn:#3ecf82;--amb:#e0a73c;--key:#1e2d29;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#0e1614;--card:#17221f;--ink:#e6efec;--mut:#8da39c;--line:#2a3a36;--pri:#2bb89c;--priInk:#06211b;--red:#e5594e;--grn:#3ecf82;--amb:#e0a73c;--key:#1e2d29;color-scheme:dark}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.45 "Be Vietnam Pro","Segoe UI",Roboto,sans-serif;min-height:100vh;display:flex;justify-content:center}
.app{width:100%;max-width:440px;display:flex;flex-direction:column;min-height:100vh;background:var(--bg)}
header{display:flex;align-items:center;justify-content:space-between;padding:14px 18px;gap:10px}
h1{font-size:18px;margin:0;font-weight:700}
.pill{display:flex;align-items:center;gap:7px;font-size:13px;padding:6px 12px;border-radius:99px;background:var(--card);border:1px solid var(--line);cursor:pointer;color:var(--ink)}
.dot{width:9px;height:9px;border-radius:50%;background:var(--red)}
.pill.on .dot{background:var(--grn)}.pill.busy .dot{background:var(--amb)}
main{flex:1;padding:0 18px 12px;overflow:auto}
nav{display:flex;border-top:1px solid var(--line);background:var(--card);position:sticky;bottom:0}
nav button{flex:1;padding:12px 4px;border:0;background:none;color:var(--mut);font:inherit;font-size:13px;cursor:pointer;border-top:3px solid transparent}
nav button[aria-selected=true]{color:var(--pri);border-top-color:var(--pri);font-weight:600}
button:focus-visible,input:focus-visible,select:focus-visible{outline:3px solid var(--pri);outline-offset:2px}
.display{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px 14px;display:flex;align-items:center;gap:8px;margin-bottom:14px}
.display input{flex:1;border:0;background:none;font:inherit;font-size:26px;color:var(--ink);min-width:0;letter-spacing:1px}
.display input::placeholder{font-size:16px;color:var(--mut);letter-spacing:0}
.pad{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.pad button{height:64px;border-radius:16px;border:1px solid var(--line);background:var(--key);color:var(--ink);font:inherit;font-size:24px;font-weight:600;cursor:pointer}
.pad button small{display:block;font-size:10px;color:var(--mut);font-weight:400;line-height:1}
.pad button:active{background:var(--line)}
.actions{display:grid;grid-template-columns:1fr 1.6fr 1fr;gap:10px;margin-top:12px;align-items:center}
.call{height:64px;border-radius:32px;border:0;background:var(--grn);color:#fff;font:inherit;font-size:17px;font-weight:700;cursor:pointer}
.ghost{height:48px;border-radius:12px;border:1px solid var(--line);background:var(--card);color:var(--ink);font:inherit;cursor:pointer;padding:0 14px}
.ghost.danger{color:var(--red)}
.list{background:var(--card);border:1px solid var(--line);border-radius:14px;overflow:hidden}
.row{display:flex;align-items:center;gap:12px;padding:12px 14px;border-bottom:1px solid var(--line)}
.row:last-child{border:0}
.av{width:40px;height:40px;border-radius:50%;background:var(--pri);color:var(--priInk);display:grid;place-items:center;font-weight:700;flex:none}
.row .t{flex:1;min-width:0}.row .t b{display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.row .t span{font-size:13px;color:var(--mut)}
.miss b{color:var(--red)}
.ib{width:40px;height:40px;border-radius:50%;border:1px solid var(--line);background:var(--key);cursor:pointer;font-size:16px;color:var(--ink)}
.empty{padding:28px 16px;text-align:center;color:var(--mut)}
.bar{display:flex;gap:8px;margin-bottom:12px}
.bar input{flex:1}
input,select{width:100%;padding:11px 12px;border-radius:10px;border:1px solid var(--line);background:var(--card);color:var(--ink);font:inherit}
label{display:block;font-size:13px;color:var(--mut);margin:12px 0 4px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:4px 14px 16px;margin-bottom:12px}
.card h2{font-size:15px;margin:14px 0 0}
.note{font-size:13px;color:var(--mut);background:var(--card);border:1px dashed var(--line);border-radius:12px;padding:10px 12px;margin-bottom:12px}
.chk{display:flex;gap:8px;align-items:center;margin-top:8px;font-size:14px}.chk input{width:auto}
.primary{background:var(--pri);color:var(--priInk);border:0;font-weight:700}
#ov{position:fixed;inset:0;background:var(--bg);display:none;flex-direction:column;align-items:center;padding:calc(40px + env(safe-area-inset-top,0px)) 24px calc(28px + env(safe-area-inset-bottom,0px));z-index:20}
#ov.show{display:flex}
#ov .av{width:92px;height:92px;font-size:36px;margin-top:20px}
#ov h2{margin:16px 0 2px;font-size:24px;text-align:center}
#st{color:var(--mut)}#tm{font-size:30px;font-variant-numeric:tabular-nums;margin:8px 0;min-height:40px}
#dt{min-height:24px;letter-spacing:2px;color:var(--mut)}
.ctl{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;margin-top:auto;width:100%;max-width:340px}
.ctl button{aspect-ratio:1;border-radius:50%;border:1px solid var(--line);background:var(--card);color:var(--ink);font:inherit;font-size:13px;cursor:pointer;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px}
.ctl button i{font-style:normal;font-size:22px}.ctl button.act{background:var(--pri);color:var(--priInk)}
.end,.acc{width:76px;height:76px;border-radius:50%;border:0;color:#fff;font-size:26px;cursor:pointer}
.end{background:var(--red)}.acc{background:var(--grn)}
.btns{display:flex;gap:46px;margin-top:22px}
#dtm{display:none;grid-template-columns:repeat(3,56px);gap:8px;margin-top:12px}
#dtm button{height:48px;border-radius:12px;border:1px solid var(--line);background:var(--card);color:var(--ink);font:inherit;font-size:20px;cursor:pointer}
#toast{position:fixed;left:50%;bottom:90px;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:9px 16px;border-radius:99px;font-size:14px;opacity:0;pointer-events:none;transition:opacity .2s;z-index:30}
#toast.show{opacity:1}
.chs{display:flex;gap:8px;overflow-x:auto;padding-bottom:10px}.chip{flex:none;padding:8px 14px;border-radius:12px;border:1px solid var(--line);background:var(--card);color:var(--ink);font:inherit;font-size:14px;cursor:pointer;text-align:left}.chip small{display:block;color:var(--mut);font-size:11px}.chip.on{border-color:var(--pri);box-shadow:inset 0 0 0 1px var(--pri)}
.ps{text-align:center;padding:9px;border-radius:10px;background:var(--key);font-weight:600}.ps.tx{background:var(--red);color:#fff}.ps.rx{background:var(--grn);color:#fff}.ps.busy{background:var(--amb);color:#fff}
.meter{display:flex;gap:3px;height:34px;align-items:flex-end;margin:10px 0}.meter i{flex:1;height:8%;background:var(--pri);border-radius:2px;transition:height .08s}
.pttbtn{display:block;margin:6px auto;width:170px;height:170px;border-radius:50%;border:6px solid var(--line);background:var(--key);color:var(--ink);font:inherit;font-size:18px;font-weight:700;cursor:pointer;touch-action:none;user-select:none;-webkit-user-select:none}.pttbtn.tx{background:var(--red);color:#fff;border-color:#f3b0aa;transform:scale(.97)}
.mem{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}.mem span{font-size:13px;padding:4px 10px;border-radius:99px;border:1px solid var(--line);display:flex;gap:6px;align-items:center}.mem span:before{content:'';width:8px;height:8px;border-radius:50%;background:var(--grn)}.mem span.hot{background:var(--grn);color:#fff}.mem span.hot:before{background:#fff}
details.note summary{cursor:pointer;font-weight:600;color:var(--ink)}
</style>
</head>
<body>
<div class="app">
<header><h1>Điện thoại SIP</h1><button class="pill" id="pill" onclick="tab('set')"><span class="dot"></span><span id="pt">Chưa đăng ký</span></button></header>
<main id="m"></main>
<nav role="tablist">
<button role="tab" data-t="dial" onclick="tab('dial')">Bàn phím</button>
<button role="tab" data-t="hist" onclick="tab('hist')">Lịch sử</button>
<button role="tab" data-t="con" onclick="tab('con')">Danh bạ</button>
<button role="tab" data-t="ptt" onclick="tab('ptt')">PTT</button>
<button role="tab" data-t="set" onclick="tab('set')">Cài đặt</button>
</nav>
</div>

<div id="ov" role="dialog" aria-modal="true">
<div class="av" id="oa">?</div><h2 id="on"></h2><div id="st"></div><div id="tm"></div><div id="dt"></div>
<div id="dtm"></div>
<div class="ctl" id="ctl">
<button id="bm" onclick="tg('mute')"><i>🎙</i>Tắt tiếng</button>
<button id="bh" onclick="tg('hold')"><i>⏸</i>Giữ máy</button>
<button id="bs" onclick="tg('spk')"><i>🔊</i>Loa ngoài</button>
<button onclick="tg('pad')"><i>⌗</i>Phím số</button>
<button id="br" onclick="tg('rec')"><i>⏺</i>Ghi âm</button>
<button onclick="tg('xfer')"><i>↪</i>Chuyển cuộc gọi</button>
</div>
<div class="btns" id="bin" style="display:none"><button class="end" aria-label="Từ chối" onclick="rejectIn()">✕</button><button class="acc" aria-label="Trả lời" onclick="answer()">✆</button></div>
<div class="btns" id="bout"><button class="end" aria-label="Kết thúc" onclick="hang()">✕</button></div>
</div>
<div id="toast"></div>

<script>
const $=s=>document.querySelector(s);
const DEF={acc:{name:"",user:"",pass:"",domain:"",proxy:"",port:"5060",tr:"UDP",ex:"",expires:"600",dtmf:"RFC2833",codecs:{"opus":1,"G.722":1,"PCMA":1,"PCMU":1,"GSM":0},dnd:false,auto:false,stun:true},con:[],hist:[],reg:false,ptt:{ch:[{name:'Điều độ',ext:'7001',type:'page',m:[{e:'101',n:'Hùng'},{e:'102',n:'Lan'},{e:'103',n:'Minh'}]},{name:'Kỹ thuật',ext:'8001',type:'conf',m:[{e:'104',n:'Tuấn'},{e:'105',n:'Hà'}]},{name:'Bảo vệ',ext:'110',type:'inter',m:[{e:'110',n:'Cổng chính'}]}],sel:0,latch:false,beep:true,sim:true,log:[]}};
let S;try{S=JSON.parse(localStorage.getItem("sip")||"null")}catch(e){S=null}
if(!S)S=JSON.parse(JSON.stringify(DEF));
S.acc=Object.assign({},DEF.acc,S.acc);S.ptt=Object.assign({},DEF.ptt,S.ptt);
function save(){try{localStorage.setItem("sip",JSON.stringify(S))}catch(e){}}
let cur="dial",num="",call=null,tmr=null,ac=null;
function toast(t){const e=$("#toast");e.textContent=t;e.classList.add("show");clearTimeout(toast.t);toast.t=setTimeout(()=>e.classList.remove("show"),2200)}
const esc=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const nameOf=n=>{const c=S.con.find(c=>c.num===n);return c?c.name:n};
const fmt=s=>String(Math.floor(s/60)).padStart(2,"0")+":"+String(s%60).padStart(2,"0");
/* âm thanh */
function ctx(){try{ac=ac||new (window.AudioContext||window.webkitAudioContext)();if(ac.state==="suspended")ac.resume()}catch(e){}return ac}
function tone(fs,d,v){const a=ctx();if(!a)return;const g=a.createGain();g.gain.value=v||.08;g.connect(a.destination);fs.forEach(f=>{const o=a.createOscillator();o.frequency.value=f;o.connect(g);o.start();o.stop(a.currentTime+d)})}
const DT={1:[697,1209],2:[697,1336],3:[697,1477],4:[770,1209],5:[770,1336],6:[770,1477],7:[852,1209],8:[852,1336],9:[852,1477],"*":[941,1209],0:[941,1336],"#":[941,1477]};
let ring=null;function ringStart(f){ringStop();const go=()=>tone(f,.9,.05);go();ring=setInterval(go,2200)}function ringStop(){clearInterval(ring);ring=null}
/* điều hướng */
function tab(t){if(tx&&t!=='ptt')txStop();cur=t;document.querySelectorAll("nav button").forEach(b=>b.setAttribute("aria-selected",b.dataset.t===t));({dial:vDial,hist:vHist,con:vCon,ptt:vPtt,set:vSet})[t]();status()}
function status(){const p=$("#pill");p.className="pill"+(S.reg===true?" on":S.reg==="busy"?" busy":"");$("#pt").textContent=S.reg===true?"Đã đăng ký"+(S.acc.user?" · "+S.acc.user:""):S.reg==="busy"?"Đang đăng ký…":"Chưa đăng ký"}
function vDial(){
$("#m").innerHTML=`<div class="display"><input id="n" inputmode="tel" placeholder="Nhập số hoặc SIP URI" value="${esc(num)}" aria-label="Số điện thoại"><button class="ib" aria-label="Xóa" onclick="del()">⌫</button></div>
<div class="pad">${[["1",""],["2","ABC"],["3","DEF"],["4","GHI"],["5","JKL"],["6","MNO"],["7","PQRS"],["8","TUV"],["9","WXYZ"],["*",""],["0","+"],["#",""]].map(k=>`<button onclick="key('${k[0]}')">${k[0]}<small>${k[1]||"&nbsp;"}</small></button>`).join("")}</div>
<div class="actions"><button class="ghost" onclick="addCon(num)">+ Lưu</button><button class="call" onclick="dial(num)">Gọi</button><button class="ghost" onclick="num='';vDial()">Xóa hết</button></div>`;
$("#n").oninput=e=>num=e.target.value;$("#n").onkeydown=e=>{if(e.key==="Enter")dial(num)}}
function key(k){num+=k;tone(DT[k]||[800],.12);$("#n").value=num}
function del(){num=num.slice(0,-1);$("#n").value=num}
function vHist(){
const h=S.hist;$("#m").innerHTML=(h.length?`<div class="bar"><button class="ghost danger" onclick="S.hist=[];save();vHist()">Xóa lịch sử</button></div>`:"")+`<div class="list">${h.length?h.map((x,i)=>`<div class="row ${x.t==="miss"?"miss":""}"><div class="av">${esc(nameOf(x.n)[0]||"?").toUpperCase()}</div><div class="t"><b>${esc(nameOf(x.n))}</b><span>${{out:"Cuộc gọi đi",in:"Cuộc gọi đến",miss:"Nhỡ"}[x.t]} · ${new Date(x.at).toLocaleString("vi-VN",{hour:"2-digit",minute:"2-digit",day:"2-digit",month:"2-digit"})}${x.d?" · "+fmt(x.d):""}</span></div><button class="ib" aria-label="Gọi lại" onclick="dial('${esc(x.n)}')">✆</button></div>`).join(""):`<div class="empty">Chưa có cuộc gọi nào. Hãy gọi thử từ tab Bàn phím.</div>`}</div>`}
function vCon(){
$("#m").innerHTML=`<div class="bar"><input id="q" placeholder="Tìm theo tên hoặc số" aria-label="Tìm"><button class="ghost primary" onclick="addCon('')">+ Thêm</button></div><div class="list" id="cl"></div>`;
const r=()=>{const q=$("#q").value.toLowerCase();const l=S.con.filter(c=>(c.name+c.num).toLowerCase().includes(q));$("#cl").innerHTML=l.length?l.map(c=>`<div class="row"><div class="av">${esc(c.name[0]||"?").toUpperCase()}</div><div class="t"><b>${esc(c.name)}</b><span>${esc(c.num)}</span></div><button class="ib" aria-label="Sửa" onclick="editCon('${c.id}')">✎</button><button class="ib" aria-label="Gọi" onclick="dial('${esc(c.num)}')">✆</button></div>`).join(""):`<div class="empty">${S.con.length?"Không tìm thấy liên hệ.":"Danh bạ trống. Bấm “+ Thêm” để lưu số đầu tiên."}</div>`};$("#q").oninput=r;r()}
function addCon(n){const nm=prompt("Tên liên hệ:");if(!nm)return;const nu=prompt("Số điện thoại / SIP URI:",n||"");if(!nu)return;S.con.push({id:"c"+Date.now(),name:nm.trim(),num:nu.trim()});save();toast("Đã lưu liên hệ");if(cur==="con")vCon()}
function editCon(id){const c=S.con.find(c=>c.id===id);const nm=prompt("Tên (để trống để xóa liên hệ):",c.name);if(nm===null)return;if(nm.trim()===""){S.con=S.con.filter(x=>x.id!==id)}else{c.name=nm.trim();const nu=prompt("Số điện thoại:",c.num);if(nu)c.num=nu.trim()}save();vCon()}
function vSet(){
const a=S.acc,tr=["UDP","TCP","TLS","WSS"];
$("#m").innerHTML=`<div class="note">Bản chạy trên trình duyệt này mô phỏng việc đăng ký và gọi để bạn thử giao diện. Để gọi thật qua tổng đài, cần ứng dụng chạy trên máy (cổng SIP/UDP) hoặc tổng đài hỗ trợ WebSocket.</div>
<div class="card"><h2>Tài khoản SIP</h2>
<label>Tên hiển thị</label><input id="a_name" value="${esc(a.name)}">
<div class="grid2"><div><label>Tên đăng nhập</label><input id="a_user" value="${esc(a.user)}" autocapitalize="off"></div><div><label>Mật khẩu</label><input id="a_pass" type="password" value="${esc(a.pass)}"></div></div>
<label>Máy chủ / Tên miền SIP</label><input id="a_domain" placeholder="sip.congty.vn" value="${esc(a.domain)}" autocapitalize="off">
<label>Máy chủ proxy (không bắt buộc)</label><input id="a_proxy" value="${esc(a.proxy)}">
<div class="grid2"><div><label>Cổng</label><input id="a_port" inputmode="numeric" value="${esc(a.port)}"></div><div><label>Giao thức</label><select id="a_tr">${tr.map(t=>`<option ${t===a.tr?"selected":""}>${t}</option>`).join("")}</select></div></div>
<div class="grid2"><div><label>Số máy lẻ (Extension)</label><input id="a_ex" value="${esc(a.ex)}"></div><div><label>Thời gian đăng ký (giây)</label><input id="a_expires" inputmode="numeric" value="${esc(a.expires)}"></div></div>
<label>Kiểu gửi DTMF</label><select id="a_dtmf">${["RFC2833","SIP INFO","Trong băng tần"].map(t=>`<option ${t===a.dtmf?"selected":""}>${t}</option>`).join("")}</select>
<div style="display:flex;gap:10px;margin-top:16px"><button class="ghost primary" style="flex:1" onclick="reg()">${S.reg===true?"Đăng ký lại":"Lưu và đăng ký"}</button>${S.reg?`<button class="ghost danger" onclick="unreg()">Hủy đăng ký</button>`:""}</div></div>
<div class="card"><h2>Codec âm thanh</h2>${Object.keys(a.codecs).map(c=>`<label class="chk"><input type="checkbox" ${a.codecs[c]?"checked":""} onchange="S.acc.codecs['${c}']=this.checked?1:0;save()">${c}</label>`).join("")}</div>
<div class="card"><h2>Tùy chọn</h2>
<label class="chk"><input type="checkbox" ${a.dnd?"checked":""} onchange="S.acc.dnd=this.checked;save()">Không làm phiền (từ chối cuộc gọi đến)</label>
<label class="chk"><input type="checkbox" ${a.auto?"checked":""} onchange="S.acc.auto=this.checked;save()">Tự động trả lời</label>
<label class="chk"><input type="checkbox" ${a.stun?"checked":""} onchange="S.acc.stun=this.checked;save()">Dùng STUN để vượt NAT</label>
<button class="ghost" style="margin-top:14px;width:100%" onclick="fakeIn()">Mô phỏng cuộc gọi đến</button></div>`}
function collect(){["name","user","pass","domain","proxy","port","tr","ex","expires","dtmf"].forEach(k=>{const e=$("#a_"+k);if(e)S.acc[k]=e.value.trim()})}
function reg(){collect();if(!S.acc.user||!S.acc.domain){toast("Cần nhập tên đăng nhập và máy chủ SIP");return}S.reg="busy";status();save();setTimeout(()=>{S.reg=true;save();status();toast("Đăng ký thành công");if(cur==="set")vSet()},1100)}
function unreg(){S.reg=false;save();status();vSet();toast("Đã hủy đăng ký")}
/* RoIP PTT (giả lập) */
let tx=null,rx=null,rxT=null,mtI=null;
const PT={page:'Paging (một chiều)',conf:'Hội nghị ConfBridge',inter:'Intercom'};
const pch=()=>S.ptt.ch[S.ptt.sel]||S.ptt.ch[0];
const dialStr=c=>c.type==='inter'?'*80'+c.ext:c.ext;
function vPtt(){const P=S.ptt,c=pch();
$('#m').innerHTML=`<div class='chs'>${P.ch.map((x,i)=>`<button class='chip ${i===P.sel?'on':''}' onclick='selCh(${i})'>${esc(x.name)}<small>${esc(x.ext)}</small></button>`).join('')}<button class='chip' onclick='addCh()'>+ Kênh</button></div>
<div class='card' style='padding-top:14px'><div class='row' style='padding:0 0 10px'><div class='t'><b>${esc(c.name)}</b><span>${PT[c.type]} · quay số ${esc(dialStr(c))}</span></div><button class='ib' aria-label='Sửa kênh' onclick='editCh()'>✎</button></div>
<div id='ps' class='ps'>Sẵn sàng</div><div class='meter' id='mt'>${'<i></i>'.repeat(16)}</div>
<button id='pb' class='pttbtn' aria-label='Nút nói PTT'></button>
<div style='text-align:center;font-size:13px;color:var(--mut)'>Phím cách (Space) cũng dùng để nói</div>
<div class='mem' id='mm'>${c.m.map(m=>`<span data-e='${esc(m.e)}'>${esc(m.e)}${m.n?' '+esc(m.n):''}</span>`).join('')}</div></div>
<div class='card'><label class='chk'><input type='checkbox' ${P.latch?'checked':''} onchange='S.ptt.latch=this.checked;save();vPtt()'>Bấm một lần để nói, bấm lại để dừng</label><label class='chk'><input type='checkbox' ${P.beep?'checked':''} onchange='S.ptt.beep=this.checked;save()'>Âm báo bắt đầu và kết thúc lượt nói</label><label class='chk'><input type='checkbox' ${P.sim?'checked':''} onchange='S.ptt.sim=this.checked;save()'>Tự giả lập thành viên khác nói</label><button class='ghost' style='width:100%;margin-top:12px' onclick='simRx()'>Mô phỏng thành viên khác nói</button></div>
<div class='list' id='pl' style='margin-bottom:12px'></div>
<details class='note'><summary>Cấu hình FreePBX cho kênh PTT</summary><div style='margin-top:8px'>Tùy phiên bản, hãy đối chiếu với giao diện FreePBX của bạn:<br>• <b>Paging:</b> Applications → Paging and Intercom → Add Paging Group, đặt số (ví dụ 7001), chọn các extension, để Duplex = No cho chế độ một chiều.<br>• <b>Hội nghị:</b> Applications → Conferences, tạo phòng (ví dụ 8001); mọi máy cùng vào phòng.<br>• <b>Intercom:</b> gọi *80 + số máy lẻ.<br>• Máy đầu cuối (điện thoại IP, app) cần bật tự động trả lời khi có Alert-Info hoặc Call-Info, nếu không sẽ đổ chuông thay vì phát tiếng ngay.</div></details>`;
const b=$('#pb');b.onpointerdown=e=>{e.preventDefault();P.latch?(tx?txStop():txStart()):txStart()};['onpointerup','onpointerleave','onpointercancel'].forEach(k=>b[k]=()=>{if(!S.ptt.latch)txStop()});b.oncontextmenu=e=>e.preventDefault();
pbState(0);renderLog();if(rx){setPs('Đang nghe: '+rx.who,'rx');meter(true)}}
function setPs(t,k){const e=$('#ps');if(!e)return;e.textContent=t;e.className='ps '+(k||'')}
function pbState(on){const b=$('#pb');if(!b)return;b.classList.toggle('tx',!!on);const l=S.ptt.latch;b.innerHTML=on?(l?'Bấm để dừng':'Thả để dừng'):(l?'Bấm để nói':'Giữ để nói')}
function meter(on){clearInterval(mtI);const bs=document.querySelectorAll('#mt i');if(on){mtI=setInterval(()=>document.querySelectorAll('#mt i').forEach(x=>x.style.height=(10+Math.random()*90)+'%'),90)}else bs.forEach(x=>x.style.height='8%')}
function hlM(e){document.querySelectorAll('#mm span').forEach(s=>s.classList.toggle('hot',s.dataset.e===e))}
function txStart(){if(tx)return;if(S.reg!==true){toast('Chưa đăng ký tài khoản SIP. Vào Cài đặt để đăng ký.');return}if(call){toast('Đang trong cuộc gọi, không thể dùng PTT');return}
if(rx){tone([480],.35);setPs('Kênh đang bận: '+rx.who+' đang nói','busy');return}
tx={t:Date.now(),c:pch()};ctx();if(S.ptt.beep)tone([1000],.12);setPs('Đang phát tới '+dialStr(tx.c)+'…','tx');pbState(1);meter(true)}
function txStop(){if(!tx)return;const d=Math.max(1,Math.round((Date.now()-tx.t)/1000));if(S.ptt.beep)tone([1500],.12);plog(tx.c,'Bạn','tx',d);tx=null;setPs('Sẵn sàng','');pbState(0);meter(false)}
function simRx(){const c=pch();if(rx||tx||call){toast('Kênh đang bận');return}if(S.reg!==true){toast('Chưa đăng ký tài khoản SIP');return}const m=c.m[Math.floor(Math.random()*c.m.length)];if(!m){toast('Kênh chưa có thành viên');return}
const who=m.e+(m.n?' '+m.n:''),d=2000+Math.random()*4000;rx={who,c};ctx();if(S.ptt.beep)tone([1200],.1);setPs('Đang nghe: '+who,'rx');meter(true);hlM(m.e);
rxT=setTimeout(()=>{plog(c,who,'rx',Math.round(d/1000));rx=null;setPs('Sẵn sàng','');meter(false);hlM(null)},d)}
setInterval(()=>{if(cur==='ptt'&&S.ptt.sim&&!rx&&!tx&&Math.random()<.3)simRx()},6000);
function plog(c,who,dir,d){S.ptt.log.unshift({c:c.name,who,dir,at:Date.now(),d});S.ptt.log=S.ptt.log.slice(0,30);save();renderLog()}
function renderLog(){const e=$('#pl');if(!e)return;const l=S.ptt.log;e.innerHTML=l.length?l.slice(0,8).map(x=>`<div class='row'><div class='t'><b>${esc(x.who)}</b><span>${esc(x.c)} · ${x.dir==='tx'?'Bạn phát':'Nhận'} · ${new Date(x.at).toLocaleTimeString('vi-VN',{hour:'2-digit',minute:'2-digit',second:'2-digit'})} · ${x.d}s</span></div></div>`).join(''):`<div class='empty'>Chưa có lượt nói nào. Giữ nút tròn để bắt đầu.</div>`}
function selCh(i){if(tx)txStop();if(rx){clearTimeout(rxT);rx=null;meter(false)}S.ptt.sel=i;save();vPtt()}
function addCh(){const nm=prompt('Tên kênh mới:');if(!nm)return;const ex=prompt('Số quay (ví dụ 7001):');if(!ex)return;const t=prompt('Loại kênh: 1 = Paging, 2 = Hội nghị, 3 = Intercom','1');S.ptt.ch.push({name:nm.trim(),ext:ex.trim(),type:{'2':'conf','3':'inter'}[t]||'page',m:[{e:'101',n:'Hùng'},{e:'102',n:'Lan'}]});S.ptt.sel=S.ptt.ch.length-1;save();vPtt()}
function editCh(){const c=pch();const nm=prompt('Tên kênh (để trống để xóa kênh):',c.name);if(nm===null)return;if(!nm.trim()){if(S.ptt.ch.length<2){toast('Cần giữ lại ít nhất một kênh');return}S.ptt.ch.splice(S.ptt.sel,1);S.ptt.sel=0;save();vPtt();return}c.name=nm.trim();const ex=prompt('Số quay (nhóm Paging, phòng hội nghị hoặc số máy lẻ):',c.ext);if(ex)c.ext=ex.trim();const ms=prompt('Thành viên, dạng 101:Hùng, 102:Lan',c.m.map(m=>m.e+':'+m.n).join(', '));if(ms!==null)c.m=ms.split(',').map(s=>s.trim()).filter(Boolean).map(s=>{const p=s.split(':');return{e:p[0].trim(),n:(p[1]||'').trim()}});save();vPtt()}
/* cuộc gọi */
function dial(n){n=(n||"").trim();if(!n){toast("Hãy nhập số cần gọi");return}if(S.reg!==true){toast("Chưa đăng ký tài khoản SIP. Vào Cài đặt để đăng ký.");return}if(call)return;
call={n,dir:"out",st:"ring",sec:0,mute:0,hold:0,spk:0,rec:0};show();ringStart([425]);call.to=setTimeout(()=>{if(call&&call.st==="ring")connect()},2800)}
function fakeIn(){if(call){toast("Đang có cuộc gọi khác");return}if(S.acc.dnd){S.hist.unshift({n:"0912345678",t:"miss",at:Date.now(),d:0});save();toast("Đã chặn: đang bật Không làm phiền");return}
call={n:"0912345678",dir:"in",st:"in",sec:0,mute:0,hold:0,spk:0,rec:0};show();ringStart([440,480]);if(S.acc.auto)setTimeout(()=>call&&call.st==="in"&&answer(),1200)}
function show(){const o=$("#ov");o.classList.add("show");const nm=nameOf(call.n);$("#oa").textContent=(nm[0]||"?").toUpperCase();$("#on").textContent=nm;$("#dt").textContent="";$("#tm").textContent="";$("#dtm").style.display="none";
const inc=call.st==="in";$("#bin").style.display=inc?"flex":"none";$("#bout").style.display=inc?"none":"flex";$("#ctl").style.visibility=inc?"hidden":"visible";
$("#st").textContent=inc?"Cuộc gọi đến…":"Đang gọi…";["bm","bh","bs","br"].forEach(i=>$("#"+i).classList.remove("act"));
$("#dtm").innerHTML=["1","2","3","4","5","6","7","8","9","*","0","#"].map(k=>`<button onclick="sendDtmf('${k}')">${k}</button>`).join("")}
function connect(){ringStop();call.st="up";$("#st").textContent="Đã kết nối";$("#bin").style.display="none";$("#bout").style.display="flex";$("#ctl").style.visibility="visible";$("#tm").textContent="00:00";tone([880],.15);tmr=setInterval(()=>{if(!call.hold){call.sec++;$("#tm").textContent=fmt(call.sec)}},1000)}
function answer(){if(call&&call.st==="in")connect()}
function rejectIn(){end("miss")}
function hang(){end(call.st==="up"?call.dir:(call.dir==="in"?"miss":"out"))}
function end(t){if(!call)return;ringStop();clearInterval(tmr);clearTimeout(call.to);S.hist.unshift({n:call.n,t,at:Date.now(),d:call.sec});S.hist=S.hist.slice(0,100);save();tone([480,620],.4);call=null;$("#ov").classList.remove("show");if(cur==="hist")vHist()}
function tg(k){if(!call||call.st!=="up"){if(k!=="pad")return}
if(k==="pad"){const d=$("#dtm");d.style.display=d.style.display==="grid"?"none":"grid";return}
if(k==="xfer"){const t=prompt("Chuyển cuộc gọi tới số:");if(t){toast("Đã chuyển cuộc gọi tới "+t);end(call.dir)}return}
call[k]=call[k]?0:1;const id={mute:"bm",hold:"bh",spk:"bs",rec:"br"}[k];$("#"+id).classList.toggle("act",!!call[k]);
$("#st").textContent=call.hold?"Đang giữ máy":"Đã kết nối";toast({mute:["Đã bật mic","Đã tắt mic"],hold:["Tiếp tục cuộc gọi","Đang giữ máy"],spk:["Tắt loa ngoài","Bật loa ngoài"],rec:["Dừng ghi âm","Đang ghi âm"]}[k][call[k]])}
function sendDtmf(k){tone(DT[k],.15);$("#dt").textContent+=k}
document.addEventListener("keydown",e=>{if(cur==="dial"&&!call&&document.activeElement.tagName!=="INPUT"&&/^[0-9*#]$/.test(e.key))key(e.key)});
document.addEventListener('keydown',e=>{if(cur==='ptt'&&e.code==='Space'&&!/INPUT|SELECT|TEXTAREA/.test(document.activeElement.tagName)){e.preventDefault();if(e.repeat)return;S.ptt.latch?(tx?txStop():txStart()):txStart()}});
document.addEventListener('keyup',e=>{if(cur==='ptt'&&e.code==='Space'&&!S.ptt.latch)txStop()});
tab("dial");
</script>
</body>
</html>
